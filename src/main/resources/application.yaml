server:
  port: ${PORT:8080}

spring:
  application:
    name: handOverIQ

  datasource:
    url: ${DB_URL}
    username: ${DB_NAME}
    password: ${DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect


gemini:
  api:
    key: ${API_KEY}
    uri: ${GEMINI_URI}